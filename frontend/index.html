<!DOCTYPE html>
<html lang="en" data-type="software" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <meta name="description" content="StockFlow — Enterprise Smart Inventory Management System. Real-time SKU tracking, stock movements, supplier tiers, and SAP Fiori inspired inventory operations.">
  <meta name="theme-color" content="#090D16">
  <title>StockFlow — Smart Enterprise Inventory Platform</title>

  <!-- Prevent Theme Flash -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('stockflow_theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {}
    })();
  </script>

  <!-- Typography: Plus Jakarta Sans & JetBrains Mono (Awwwards-Tier Spec) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Enterprise ERP Stylesheet Hierarchy -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages/dashboard.css">
  <link rel="stylesheet" href="css/pages/products.css">
  <link rel="stylesheet" href="css/pages/inventory.css">
  <link rel="stylesheet" href="css/pages/movements.css">
  <link rel="stylesheet" href="css/pages/suppliers.css">
  <link rel="stylesheet" href="css/pages/reports.css">
  <link rel="stylesheet" href="css/pages/settings.css">
</head>
<body class="antialiased">
  <!-- Subtle Ambient Glow Mesh -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Mobile Sidebar Backdrop Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- App Shell Layout -->
  <div class="app-container">
    <!-- Obsidian Titanium Sidebar -->
    <aside class="app-sidebar" id="sidebar-container" aria-label="Primary Navigation"></aside>

    <!-- Main Content Application Wrapper -->
    <div class="app-wrapper">
      <!-- Floating Glass Island Top Navigation Bar -->
      <header class="app-topbar-wrapper">
        <div class="app-topbar" id="topbar-container"></div>
      </header>

      <!-- Dynamic Page Content Outlet -->
      <main class="app-main-content" id="main-content" role="main">
        <!-- Initial view will be rendered automatically by router -->
      </main>
    </div>
  </div>

  <!-- Universal Application Script (Runs everywhere: file://, localhost, and web servers) -->
  <script src="js/app.bundle.js"></script>
</body>
</html>
